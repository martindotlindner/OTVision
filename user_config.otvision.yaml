---
CONVERT:
  PATHS: []
  DELETE_INPUT: false
  FPS_FROM_FILENAME: true
  INPUT_FPS: 20.0
  ROTATION: 0
  OVERWRITE: true
  DETECT_START: null
  DETECT_END: null

DETECT:
  PATHS: []
  FORCE_RELOAD_TORCH_HUB_CACHE: false
  HALF_PRECISION: false
  OVERWRITE: true
  YOLO:
    CONF: 0.15        # Gesenkt von 0.25: mehr Detektionen, weniger Missed (bes. Fußgänger)
    IMGSIZE: 1280     # Erhöht von 640: bessere Erkennung kleiner Objekte
    IOU: 0.45
    WEIGHTS: yolov8x  # Erhöht von yolov8s: deutlich mehr Kapazität

TRACK:
  PATHS: []
  IOU:
    SIGMA_H: 0.45     # Erhöht von 0.42
    SIGMA_IOU: 0.35   # Gesenkt von 0.38
    SIGMA_L: 0.20     # Gesenkt von 0.27: Track früher starten
    T_MIN: 3          # Gesenkt von 5: Track früher als valide ansehen
    T_MISS_MAX: 40    # Gesenkt von 51: weniger Ghost-Tracks
  OVERWRITE: true

LOG:
  LOG_LEVEL_CONSOLE: WARNING
  LOG_LEVEL_FILE: DEBUG
